name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install ruff

      - name: Lint
        run: ruff check app/ tests/

      - name: Format check
        run: ruff format --check app/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit tests with coverage
        run: pytest --tb=short -q --cov=app --cov-report=term-missing --cov-fail-under=60

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install pip-audit

      - name: Dependency audit
        run: pip-audit -r requirements.txt

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nikkoe-backend:ci .

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate migration files
        run: |
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No migration files found — skipping"
            exit 0
          fi
          errors=0
          for f in "${files[@]}"; do
            name=$(basename "$f")
            if [[ ! "$name" =~ ^[0-9]{8} ]]; then
              echo "ERROR: $name does not start with a date (YYYYMMDD)"
              errors=1
            fi
            if [ ! -s "$f" ]; then
              echo "ERROR: $name is empty"
              errors=1
            else
              echo "OK: $name ($(wc -c < "$f") bytes)"
            fi
          done
          exit $errors
